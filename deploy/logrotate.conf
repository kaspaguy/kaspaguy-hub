# Page-view log for kaspaguy.com: no IPs, deleted after 30 days (stated on kaspaguy.com/trust#privacy).
/var/log/kaspaguy-site/*.log {
	daily
	rotate 30
	maxage 30
	missingok
	notifempty
	compress
	delaycompress
	create 0640 www-data adm
	sharedscripts
	postrotate
		invoke-rc.d nginx rotate >/dev/null 2>&1
	endscript
}
