# kaspaguy.com page-view log: no IP addresses, no query strings. Kept 30 days (/etc/logrotate.d/kaspaguy-site).
map $request_uri $kaspaguy_path { "~^(?<p>[^?]*)" $p; default "-"; }
log_format kaspaguy_noip "$time_iso8601 $request_method $kaspaguy_path $status $body_bytes_sent \"$http_referer\" \"$http_user_agent\"";
