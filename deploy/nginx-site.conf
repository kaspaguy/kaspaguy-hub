# Kaspaguy hub (ledger + KaspaChat page). Built from this repo: build.py -> dist/ -> web root /var/www/kaspaguy-site.
# Cloudflare-proxied only. Canonical address: https://kaspaguy.com (http and www redirect there).
server {
    listen 80;
    listen [::]:80;
    server_name kaspaguy.com www.kaspaguy.com;
    include snippets/cloudflare-only.conf;
    access_log off;
    return 301 https://kaspaguy.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.kaspaguy.com;
    ssl_certificate /etc/ssl/certs/kaspaguy.com.crt;
    ssl_certificate_key /etc/ssl/private/kaspaguy.com.key;
    include snippets/cloudflare-only.conf;
    access_log off;
    return 301 https://kaspaguy.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kaspaguy.com;
    ssl_certificate /etc/ssl/certs/kaspaguy.com.crt;
    ssl_certificate_key /etc/ssl/private/kaspaguy.com.key;
    error_log /var/log/nginx/kaspaguy.com.error.log crit;
    include snippets/kaspaguy-site.conf;
}
