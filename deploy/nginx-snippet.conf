# kaspaguy.com site settings. Like kaspa-sites-common.conf, but logs page views without IPs and has a 404 page.
    include snippets/cloudflare-only.conf;
    access_log /var/log/kaspaguy-site/access.log kaspaguy_noip;
    root /var/www/kaspaguy-site;
    index index.html;
    error_page 404 /404.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    # Written every 5 minutes by kc-agents chief.py status (pre-approved texts only).
    location = /testnet-status.json { alias /var/www/kc-status/testnet-status.json; access_log off; add_header Cache-Control "no-store"; }
    location / { try_files $uri $uri.html $uri/ =404; add_header Cache-Control "no-cache"; }
    # KaspaChat help widget (kc-helpbot). Not in the page-view log: questions aren't page views.
    location = /api/help/status { access_log off; set $kv_client $http_cf_connecting_ip; limit_req zone=kvweb burst=60 nodelay; proxy_pass http://127.0.0.1:5515; }
    location ^~ /api/help {
        access_log off;
        set $kv_client $http_cf_connecting_ip;
        limit_req zone=kchelp burst=5 nodelay;
        client_max_body_size 8k;
        proxy_read_timeout 45s;
        proxy_set_header X-KC-Client $kv_client;
        proxy_pass http://127.0.0.1:5515;
    }
