# kaspaguy.com site settings. Like kaspa-sites-common.conf, but logs page views without IPs and has a 404 page.
    include snippets/cloudflare-only.conf;
    # STAGING: remove these two lines at go-live
    auth_basic "Kaspaguy staging";
    auth_basic_user_file /etc/nginx/kaspachat-testnet.htpasswd;
    access_log /var/log/kaspaguy-site/access.log kaspaguy_noip;
    root /var/www/kaspaguy-site;
    index index.html;
    error_page 404 /404.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    location / { try_files $uri $uri.html $uri/ =404; add_header Cache-Control "no-cache"; }
